services:
  - type: web
    name: supply-chain-risk-ai-backend
    runtime: python
    pythonVersion: "3.11.9"
    rootDir: backend
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      cd backend && python -m scripts.ingest --rebuild --local-embed
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: supply-chain-risk-ai
      - key: LANGSMITH_TRACING
        value: "true"
      - key: PRIMARY_LLM_MODEL
        value: gpt-4o-mini
      - key: FALLBACK_LLM_MODEL
        value: llama-3.1-8b-instant
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: FALLBACK_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2

  - type: web
    name: supply-chain-risk-ai-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE
        value: https://supply-chain-risk-ai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
